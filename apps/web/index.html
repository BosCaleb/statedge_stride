<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1C3E" />
    <meta
      name="description"
      content="Running technique analysis from slow-motion video, on the phone."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stride" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>StatEdge Stride</title>
    <link rel="stylesheet" href="/src/styles/loader.css" />
    <link rel="preload" href="/brand/statedge-icon.png" as="image" />
  </head>
  <body>
    <!-- React replaces this with the same loader while the initial route loads. -->
    <div id="root">
      <div class="se-loader se-loader--screen" role="status" aria-label="Loading StatEdge Stride">
        <div class="se-glow" aria-hidden="true"></div>
        <div class="se-stage" aria-hidden="true">
          <div class="se-rings">
            <svg viewBox="0 0 760 760" fill="none">
              <circle cx="380" cy="380" r="360" pathLength="1"></circle>
              <circle cx="380" cy="380" r="300" pathLength="1"></circle>
              <circle cx="380" cy="380" r="240" pathLength="1"></circle>
            </svg>
          </div>
          <div class="se-logo">
            <img src="/brand/statedge-icon.png" width="530" height="520" alt="" />
            <div class="se-glint"></div>
          </div>
          <div class="se-text">
            <div class="se-word">STAT<span>EDGE</span></div>
            <div class="se-line"></div>
            <div class="se-slogan">SMARTER DATA. SHARPER DECISIONS</div>
          </div>
        </div>
        <p class="se-caption" aria-hidden="true">Loading StatEdge Stride</p>
      </div>
    </div>
    <noscript>
      <style>
        #root {
          display: none;
        }
      </style>
      StatEdge Stride needs JavaScript.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
