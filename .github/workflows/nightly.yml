name: Nightly real-model check

# One short clip through the real MediaPipe pose model on the CPU delegate, in the worker of a
# test build, to catch regressions in the model, its WASM runtime or the browser. Pull requests
# use the recorded-keypoint estimator instead (ci.yml). Runs every night and on demand.

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model:
    name: Real pose model in the browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the pinned pose model and WASM runtime (checksums verified)
        run: pnpm fetch-models
      - name: Install Chromium for Playwright
        run: pnpm --filter @stride/web exec playwright install --with-deps chromium
      - run: pnpm --filter @stride/web build:e2e
      - name: Run the clip through the real model
        env:
          STRIDE_REAL_MODEL: '1'
        run: pnpm --filter @stride/web exec playwright test e2e/real-model.spec.ts --project chromium
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-model-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
