packages:
  - apps/*
  - packages/*
  - fixtures
  - scripts

# pnpm 10 does not run dependency install scripts unless they are listed here.
onlyBuiltDependencies:
  - esbuild
# Their install scripts only print banners or rebuild optional bits we do not use.
ignoredBuiltDependencies:
  - core-js
  - protobufjs

# Dependency versions are pinned by pnpm-lock.yaml; CI installs with --frozen-lockfile.
engineStrict: true

overrides:
  # GHSA-xcx6-jx8p-x3h5: @azure/msal-node before 7.1.0. It arrives through mssql > tedious >
  # @azure/identity, whose latest release still asks for ^6. Remove once @azure/identity itself
  # depends on 7.1 or later (docs/decisions.md, D81).
  '@azure/msal-node': ^7.1.0
